<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#245C4F"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4"/><link rel="stylesheet" href="/css/site.css?v=6"/><meta name="description" content="Thoughtfully curated essentials for everyday living. Discover the ShopQevora demo collection."/><meta property="og:title" content="ShopQevora — An elevated everyday"/><meta property="og:description" content="Considered essentials for your everyday. Explore the ShopQevora demo collection."/><meta property="og:type" content="website"/><title>ShopQevora</title><base href="/"/><style>/* Critical first-paint styles, isolated from the storefront. */
.startup-screen{box-sizing:border-box;position:fixed;inset:0;z-index:1000;min-height:100svh;display:grid;place-items:center;overflow:auto;padding:32px 20px;background:var(--bg,#f8f6f2);color:var(--green,#245c4f);opacity:1;transition:opacity 160ms ease-out}
.startup-composition{width:min(100%,420px);text-align:center;padding:20px 0;animation:startup-arrive 600ms ease-out both}
.startup-mark{position:relative;width:clamp(104px,11vw,136px);height:clamp(104px,11vw,136px);margin:0 auto 26px;perspective:800px;isolation:isolate}
.startup-mark::before{content:"";position:absolute;left:16%;right:16%;bottom:1%;height:14%;border-radius:50%;background:var(--green,#245c4f);opacity:.09;filter:blur(12px);animation:startup-shadow 4.8s ease-in-out infinite}
.startup-mark img{display:block;width:100%;height:100%;position:relative;transform-origin:50% 55%;animation:startup-dimension 4.8s ease-in-out infinite}
.startup-wordmark{font-family:var(--serif,Fraunces,Georgia,serif);font-size:clamp(34px,5vw,46px);font-weight:500;line-height:1.2;letter-spacing:-1.3px;margin:0 0 15px;color:var(--green,#245c4f);font-variation-settings:'SOFT' 10,'WONK' 0,'opsz' 48;white-space:nowrap}
.startup-letter{display:inline-block;animation:startup-letter 420ms cubic-bezier(.2,.65,.3,1) both;animation-delay:var(--letter-delay)}
.startup-tagline{font-family:var(--sans,Manrope,Arial,sans-serif);font-size:10px;font-weight:500;letter-spacing:1.5px;line-height:1.8;margin:0;color:var(--muted,#656a62)}
.startup-indicator{position:relative;width:164px;height:2px;margin:29px auto 0;overflow:hidden;border-radius:10px;background:var(--sage,#dde6dc)}
.startup-indicator::after{content:"";position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:var(--green,#245c4f);animation:startup-flow 1.8s cubic-bezier(.45,0,.55,1) infinite}
.startup-screen.startup-leaving{opacity:0;pointer-events:none}.startup-content-enter{animation:startup-content 120ms ease-out}
.startup-error{margin:26px auto 0;max-width:310px;font-family:var(--sans,Manrope,Arial,sans-serif);font-size:12px;line-height:1.8}.startup-error[hidden]{display:none}.startup-error p{margin:0 0 16px;color:var(--text,#20231f)}
.startup-retry{font:600 12px var(--sans,Manrope,Arial,sans-serif);padding:12px 24px;min-height:44px;border:1px solid var(--green,#245c4f);border-radius:7px;background:var(--green,#245c4f);color:var(--bg,#f8f6f2);cursor:pointer}.startup-retry:focus-visible{outline:3px solid var(--green,#245c4f);outline-offset:5px}
.startup-failed .startup-mark img,.startup-failed .startup-mark::before,.startup-failed .startup-indicator::after,.startup-failed .startup-letter{animation:none;transform:none;opacity:1}.startup-failed .startup-indicator{display:none}
.startup-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes startup-arrive{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes startup-dimension{0%,100%{transform:rotateX(4deg) rotateY(-8deg) rotateZ(-1deg) translateY(0)}50%{transform:rotateX(-3deg) rotateY(7deg) rotateZ(1deg) translateY(-3px)}}
@keyframes startup-shadow{0%,100%{transform:scale(.88);opacity:.07}50%{transform:scale(1);opacity:.11}}
@keyframes startup-letter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes startup-flow{from{transform:translateX(-110%)}to{transform:translateX(350%)}}
@keyframes startup-content{from{opacity:.94}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.startup-screen{transition:none}.startup-composition,.startup-mark img,.startup-mark::before,.startup-letter,.startup-indicator::after,.startup-content-enter{animation:none!important;transform:none!important;opacity:1}.startup-indicator::after{left:29%}}
</style></head><body><div id="app"><section id="startup-screen" class="startup-screen" role="status" aria-live="polite" aria-busy="true" aria-label="Loading ShopQevora">
<div class="startup-composition"><div class="startup-mark"><img src="/monogram.svg" alt="" width="136" height="136" fetchpriority="high"/></div>
<h1 class="startup-wordmark" aria-label="ShopQevora"><span aria-hidden="true"><span class="startup-letter" style="--letter-delay:0ms">S</span><span class="startup-letter" style="--letter-delay:24ms">h</span><span class="startup-letter" style="--letter-delay:48ms">o</span><span class="startup-letter" style="--letter-delay:72ms">p</span><span class="startup-letter" style="--letter-delay:96ms">Q</span><span class="startup-letter" style="--letter-delay:120ms">e</span><span class="startup-letter" style="--letter-delay:144ms">v</span><span class="startup-letter" style="--letter-delay:168ms">o</span><span class="startup-letter" style="--letter-delay:192ms">r</span><span class="startup-letter" style="--letter-delay:216ms">a</span></span></h1>
<p class="startup-tagline">Discover Better. Shop Smarter.</p><div class="startup-indicator" aria-hidden="true"></div><span id="startup-status" class="startup-status">Loading the ShopQevora store.</span>
<div id="startup-error" class="startup-error" role="alert" hidden><p>We couldn’t open the store. Please check your connection and try again.</p><button id="startup-retry" class="startup-retry" type="button" onclick="window.location.reload()">Reload the store</button></div>
<noscript><p class="startup-error">Please enable JavaScript to open ShopQevora, then reload this page.</p></noscript></div></section></div><div id="blazor-error-ui" hidden>Something went wrong. <a href="" class="reload">Reload</a><a class="dismiss">×</a></div><script src="js/startup.js" onerror="const s=document.getElementById('startup-screen');s.classList.add('startup-failed');s.setAttribute('aria-busy','false');s.removeAttribute('role');s.removeAttribute('aria-live');document.getElementById('startup-error').hidden=false;"></script><script id="blazor-startup" src="_framework/blazor.webassembly.js" autostart="false" defer></script></body></html>
